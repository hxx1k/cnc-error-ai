<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L2100 車床手冊 AI 助理</title>

<style>

body{
    margin:0;
    padding:0;
    background:#020817;
    color:white;
    font-family:"Microsoft JhengHei",sans-serif;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
    padding:30px 0;
}

.card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:18px;
    padding:28px;
    margin-bottom:20px;
}

.title{
    font-size:34px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    color:#cbd5e1;
    line-height:1.8;
}

.quick-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.quick-btn{
    background:#0f172a;
    border:1px solid #334155;
    color:white;
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
    font-size:16px;
}

.quick-btn:hover{
    background:#1d4ed8;
}

.input-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

#question{
    flex:1;
    padding:16px;
    border-radius:14px;
    border:none;
    background:#1e293b;
    color:white;
    font-size:18px;
}

.send-btn{
    background:#2563eb;
    border:none;
    color:white;
    padding:16px 28px;
    border-radius:14px;
    cursor:pointer;
    font-size:18px;
}

.send-btn:hover{
    background:#1d4ed8;
}

.user-msg{
    background:#2563eb;
    padding:18px;
    border-radius:18px;
    margin-top:20px;
    margin-bottom:15px;
    font-size:22px;
}

.answer-card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:18px;
    padding:25px;
    line-height:1.9;
    white-space:pre-wrap;
    font-size:17px;
}

.result-image{
    width:100%;
    max-width:700px;
    border-radius:14px;
    margin-top:12px;
    margin-bottom:20px;
    border:1px solid #334155;
}

.image-meta{
    font-size:14px;
    color:#cbd5e1;
    margin-top:10px;
    margin-bottom:6px;
}

.badge{
    display:inline-block;
    background:#475569;
    color:white;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    margin-bottom:14px;
}

.loading{
    color:#93c5fd;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="badge">三本手冊限定回答</div>

        <div class="title">
            你好，我是 L2100 車床手冊 AI 助理。
        </div>

        <div class="subtitle">

你可以問：

<br><br>

• G02 是什麼？<br>
• G04 怎麼用？<br>
• M03 是什麼功能？<br>
• 參數0002 是什麼？<br>
• MOT 警報怎麼排除？<br>
• EtherCAT 版本要注意什麼？

        </div>

    </div>

    <div class="quick-buttons">

        <button class="quick-btn" onclick="quickAsk('G02 是什麼？')">G02 是什麼？</button>

        <button class="quick-btn" onclick="quickAsk('G04 暫停')">G04 暫停</button>

        <button class="quick-btn" onclick="quickAsk('參數 0002')">參數 0002</button>

        <button class="quick-btn" onclick="quickAsk('EtherCAT')">EtherCAT</button>

        <button class="quick-btn" onclick="quickAsk('M03 功能')">M03 功能</button>

    </div>

    <div class="input-row">

        <input
            id="question"
            type="text"
            placeholder="輸入車床手冊問題..."
            onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button class="send-btn" onclick="sendMessage()">
            查詢
        </button>

    </div>

    <div id="chat-area"></div>

</div>

<script>

const API_URL = "https://cnc-error-ai.onrender.com/search";

function quickAsk(text){
    document.getElementById("question").value = text;
    sendMessage();
}

async function sendMessage(){

    const input = document.getElementById("question");

    const q = input.value.trim();

    if(!q) return;

    const area = document.getElementById("chat-area");

    area.innerHTML += `
        <div class="user-msg">
            ${q}
        </div>
    `;

    area.innerHTML += `
        <div class="answer-card loading" id="loading">
            查詢中...
        </div>
    `;

    input.value = "";

    try{

        const response = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                query:q
            })
        });

        const data = await response.json();

        document.getElementById("loading").remove();

        let html = `
            <div class="answer-card">

                <div class="badge">
                    查到 ${data.count} 筆手冊資料
                </div>

                ${data.answer}
        `;

        if(data.images && data.images.length > 0){

            html += `
                <br><br>
                <div style="color:#facc15;font-weight:bold;font-size:22px;">
                    相關手冊圖片：
                </div>
            `;

            for(const img of data.images){

                if(typeof img === "string"){

                    html += `
                        <div class="image-meta">
                            圖片來源：未標示
                        </div>

                        <img
                            src="${img}"
                            class="result-image"
                            loading="lazy"
                        >
                    `;

                }else{

                    html += `
                        <div class="image-meta">
                            圖片來源：
                            ${img.source_file || "未知手冊"}
                            ，第 ${img.page || "未知"} 頁
                        </div>

                        <img
                            src="${img.url}"
                            class="result-image"
                            loading="lazy"
                        >
                    `;
                }
            }
        }

        html += `</div>`;

        area.innerHTML += html;

        window.scrollTo({
            top:document.body.scrollHeight,
            behavior:"smooth"
        });

    }catch(err){

        document.getElementById("loading").remove();

        area.innerHTML += `
            <div class="answer-card">
                API 連線失敗：
                ${err}
            </div>
        `;
    }
}

</script>

</body>
</html>
