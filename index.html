<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<title>CNC AI 助理</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
}

.header{
    padding:20px;
    background:#111827;
    font-size:24px;
    font-weight:bold;
    border-bottom:1px solid #334155;
}

.chat{
    height:calc(100vh - 140px);
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:900px;
    margin:auto;
    margin-bottom:20px;
    padding:16px;
    border-radius:14px;
    line-height:1.7;
    white-space:pre-wrap;
}

.user{
    background:#2563eb;
}

.bot{
    background:#1e293b;
    border:1px solid #334155;
}

.input-area{
    display:flex;
    gap:10px;
    padding:20px;
    background:#111827;
}

input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:14px 20px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#16a34a;
}

.result-image{
    margin-top:15px;
    max-width:100%;
    border-radius:12px;
    border:1px solid #475569;
}

</style>

</head>

<body>

<div class="header">
🔧 CNC AI 助理
</div>

<div class="chat" id="chat">

<div class="message bot">
你好，我是 CNC AI 助理。<br>
你可以直接輸入：

231-E018

或：

G02 是什麼？
</div>

</div>

<div class="input-area">

<input
    id="query"
    placeholder="輸入錯誤代碼或問題..."
    onkeydown="handleKey(event)"
>

<button onclick="sendMessage()">
送出
</button>

</div>

<script>

const API_URL =
"https://cnc-error-ai.onrender.com/search";

function addMessage(text,type){

    const chat=document.getElementById("chat");

    const div=document.createElement("div");

    div.className="message "+type;

    div.innerHTML=text;

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;

    return div;
}

function handleKey(event){

    if(event.key==="Enter"){

        sendMessage();
    }
}

async function sendMessage(){

    const input=document.getElementById("query");

    const q=input.value.trim();

    if(!q)return;

    addMessage(q,"user");

    input.value="";

    const loading=addMessage(
        "查詢中...",
        "bot"
    );

    try{

        const res=await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                query:q
            })
        });

        const data=await res.json();

        if(data.count===0){

            loading.innerHTML=
            "查無資料";

            return;
        }

        let html="";

        html+=`
        <div>
        ${data.answer}
        </div>
        `;

        // =====================
        // 顯示圖片
        // =====================

        if(data.images){

            for(const img of data.images){

                html+=`
                <img
                    src="https://cnc-error-ai.onrender.com${img}"
                    class="result-image"
                >
                `;
            }
        }

        loading.innerHTML=html;

    }catch(err){

        loading.innerHTML=
        "API連線失敗";

        console.error(err);
    }
}

</script>

</body>
</html>
